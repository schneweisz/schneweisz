# .github/workflows/metrics.yml
# Ez a te profil-repódba kerül (pl. schneweisz/schneweisz)
# Naponta és minden push-ra legenerálja a github-metrics.svg-t

name: Metrics
on:
  # Automatikus futás minden nap 00:00-kor (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Manuális indítás az Actions fülről
  workflow_dispatch:
  # Push-ra is frissüljön
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # A tokent a repo Settings > Secrets and variables > Actions alatt hozd létre
          # FONTOS: classic (nem fine-grained) token kell, "repo" scope-pal
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          debug: yes

          # --- Alap megjelenés ---
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Europe/Bratislava

          # --- Commit naptár (isometric calendar) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Nyelvi statisztika ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_threshold: 0%
          plugin_languages_limit: 8

          # --- Kódolási szokások, legutóbbi aktivitás, achievements ---
          # Ez a három plugin jelenleg ismert, javítatlan upstream bugok miatt
          # mindig "Unexpected error"-t dob (nem a te fiókod/beállításod a hiba oka):
          #  - habits: TypeError egy hozzáférhetetlen commit feldolgozásakor
          #  - activity: TypeError null actor mezőjű eseménynél
          #  - achievements: a GitHub kivezette a Projects (classic) API-t, amit ez még hív
          # Ezért egyelőre kikapcsolva. Ha a projekt frissül és javítják, visszakapcsolhatók.
          plugin_habits: no
          plugin_activity: no
          plugin_achievements: no

          # --- Kiemelt repók (pinnelt, vagy legaktívabb) ---
          # TÖRÖLVE (felhasználói kérésre)

          # --- Csillagozók ---
          # TÖRÖLVE (felhasználói kérésre)

          # --- Extra "feldobó" pluginek ---
          # Pontosabb nyelvi statisztika (klónozza a repókat, ezért lassabb és
          # analysis_timeout kell hozzá, de sokkal szebb/pontosabb arányokat ad)
          plugin_languages_indepth: yes
          plugin_languages_details: percentage

          # Teljes évet mutató isometric naptár már fentebb beállítva

          # Hány sor kódot írtál összesen (compact módban a base repositories
          # szekcióba simul, nem külön blokk)
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_delay: 30

          # Kiemelt/notable közreműködések más (nem sajád) repókban - ha vannak
          # ilyenek, nagyon jól mutat egy IT-s profilon
          plugin_notable: yes
          plugin_notable_types: pr, issue
          plugin_notable_filter: reactions>0 stargazers>0
