# .github/workflows/metrics.yml
# Ez a te profil-repódba kerül (pl. schneweisz/schneweisz)
# Naponta és minden push-ra legenerálja a github-metrics.svg-t

name: Metrics
on:
  # Automatikus futás minden nap 00:00-kor (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Manuális indítás az Actions fülről
  workflow_dispatch:
  # Push-ra is frissüljön
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # A tokent a repo Settings > Secrets and variables > Actions alatt hozd létre
          # FONTOS: classic (nem fine-grained) token kell, "repo" scope-pal
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          debug: yes

          # --- Alap megjelenés ---
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Bratislava

          # --- Commit naptár (isometric calendar) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # --- Nyelvi statisztika ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_threshold: 0%
          plugin_languages_limit: 8

          # --- Kódolási szokások, legutóbbi aktivitás, achievements ---
          # Ez a három plugin jelenleg ismert, javítatlan upstream bugok miatt
          # mindig "Unexpected error"-t dob (nem a te fiókod/beállításod a hiba oka):
          #  - habits: TypeError egy hozzáférhetetlen commit feldolgozásakor
          #  - activity: TypeError null actor mezőjű eseménynél
          #  - achievements: a GitHub kivezette a Projects (classic) API-t, amit ez még hív
          # Ezért egyelőre kikapcsolva. Ha a projekt frissül és javítják, visszakapcsolhatók.
          plugin_habits: no
          plugin_activity: no
          plugin_achievements: no

          # --- Kiemelt repók (pinnelt, vagy legaktívabb) ---
          plugin_repositories: yes
          # üresen hagyva a legaktívabb/legutóbb frissített repókat választja automatikusan
          # ha konkrét repókat akarsz kiemelni, itt sorold fel a PONTOS, saját fiókodban
          # létező repó neveket vesszővel elválasztva, pl:
          # plugin_repositories_featured: metrics-teszt, homelab-configs

          # --- Csillagozók ---
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
