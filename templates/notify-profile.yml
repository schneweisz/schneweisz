# templates/notify-profile.yml
# Ezt a fájlt MINDEN olyan repóba másold be ide:
#   .github/workflows/notify-profile.yml
# amelynek a pusholása után frissülnie kell a profil README metrikáinak.
#
# Az adott repóban kell egy secret: Settings > Secrets and variables > Actions
#   PROFILE_DISPATCH_TOKEN = ugyanaz a classic token "repo" scope-pal,
#                            mint a METRICS_TOKEN a profil repóban
name: Notify profile metrics
on:
  push:
    branches: ["**"]   # bármelyik branch (main, design, frontend, backend, ...)

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Profil metrika frissítés kérése
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PROFILE_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/schneweisz/schneweisz/dispatches \
            -d '{"event_type":"metrics-refresh","client_payload":{"repo":"${{ github.repository }}","ref":"${{ github.ref_name }}"}}'
